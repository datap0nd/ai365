name: Build Windows installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: msbuild OutlookLocalAIChat.sln /m /p:Configuration=Release

      - name: Run guardrail tests
        run: tests\GuardrailTests\bin\Release\GuardrailTests.exe

      - name: Run static capability scan
        shell: pwsh
        run: ./scripts/Test-Guardrails.ps1

      - name: Inspect .NET COM registration contract
        shell: powershell
        run: |
          $assembly = Resolve-Path "src\OutlookLocalAIChat\bin\Release\OutlookLocalAIChat.dll"
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\RegAsm.exe" `
            $assembly /codebase /regfile:managed-com.reg
          $registration = Get-Content managed-com.reg -Raw
          if (-not $registration.Contains("OutlookLocalAIChat.AddIn")) {
            throw "RegAsm did not export the add-in COM class."
          }
          if ($registration.Contains("OutlookLocalAIChat.UI.ChatWindow")) {
            throw "A non-add-in class was exported to COM."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build single-file installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=1.0.0" `
            "installer\OutlookLocalAIChat.iss"

      - name: Smoke-test installer registration
        shell: powershell
        run: |
          $installer = Resolve-Path "artifacts\OutlookLocalAIChatSetup.exe"
          Start-Process $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $installedDll = Join-Path $env:LOCALAPPDATA "Programs\OutlookLocalAIChat\OutlookLocalAIChat.dll"
          if (-not (Test-Path $installedDll)) {
            throw "Installed add-in DLL was not found."
          }
          [void][Reflection.Assembly]::LoadFrom($installedDll)
          $addinKey = "HKCU:\Software\Microsoft\Office\Outlook\Addins\OutlookLocalAIChat.AddIn"
          if ((Get-ItemProperty $addinKey).LoadBehavior -ne 3) {
            throw "Outlook add-in registration is missing or disabled."
          }
          $clsid = "{0D6E56F9-BE2D-4B94-B5E4-4C2DB0FD13E7}"
          $serverKey = "HKCU:\Software\Classes\CLSID\$clsid\InprocServer32"
          $server = Get-ItemProperty $serverKey
          Write-Host "COM class: $($server.Class)"
          Write-Host "COM assembly: $($server.Assembly)"
          Write-Host "COM runtime: $($server.RuntimeVersion)"
          Write-Host "COM codebase: $($server.CodeBase)"
          $codeBasePath = ([Uri]$server.CodeBase).LocalPath
          Write-Host "COM local path: $codeBasePath"
          if (-not (Test-Path $codeBasePath)) {
            throw "The registered COM codebase does not resolve to the installed DLL."
          }
          $addin64 = New-Object -ComObject OutlookLocalAIChat.AddIn
          if ($null -eq $addin64) {
            throw "64-bit COM activation failed."
          }
          [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($addin64)
          $powershell32 = "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe"
          & $powershell32 -NoProfile -Command @'
          $addin32 = New-Object -ComObject OutlookLocalAIChat.AddIn
          if ($null -eq $addin32) { throw "32-bit COM activation failed." }
          [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($addin32)
          '@
          if ($LASTEXITCODE -ne 0) {
            throw "32-bit COM activation failed."
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OutlookLocalAIChatSetup
          path: artifacts/OutlookLocalAIChatSetup.exe
          if-no-files-found: error

      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/OutlookLocalAIChatSetup.exe
          generate_release_notes: true
